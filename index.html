
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GALACTICA STRIKE</title>

<style>
* {
 box-sizing:border-box;
 -webkit-user-select:none;
 user-select:none;
 -webkit-touch-callout:none;
 -webkit-tap-highlight-color:transparent;
}

html,body {
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
 background:#050817;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 overflow-x:hidden;
 overscroll-behavior:none;
}

body {
 touch-action:pan-y;
}

header {padding:14px 8px 8px}

h1 {
 margin:4px 0;
 color:#55eaff;
 font-size:clamp(25px,6vw,38px);
 letter-spacing:3px;
 text-shadow:0 0 15px #00cfff;
}

.subtitle {color:#aabbd8;font-size:13px}

#hud {
 display:flex;
 justify-content:center;
 gap:22px;
 flex-wrap:wrap;
 padding:12px;
 font-weight:bold;
 color:#75edff;
}

#game {
 display:block;
 width:min(96vw,600px);
 height:auto;
 margin:0 auto;
 background:#030817;
 border:2px solid #167da8;
 border-radius:8px;
 box-shadow:0 0 22px #006c9b;
 touch-action:none;
}

.controls {
 display:flex;
 justify-content:center;
 gap:12px;
 margin:12px auto;
 max-width:600px;
}

button {
 background:#102b4b;
 color:white;
 border:1px solid #38dfff;
 border-radius:10px;
 padding:12px 17px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 10px #087da0;
 touch-action:none;
 -webkit-user-select:none;
 user-select:none;
}

button:active {
 background:#17638b;
 transform:scale(.96);
}

#mobileControls button {
 width:30%;
 max-width:120px;
 height:58px;
 font-size:22px;
}

#message {
 min-height:24px;
 color:#ffdf75;
 font-weight:bold;
 margin:8px;
}

.small {
 font-size:12px;
 color:#9aacc5;
 padding:4px 12px 18px;
}

</style>
</head>

<body>

<header>
 <h1>GALACTICA STRIKE</h1>
 <div class="subtitle">DEFEND THE GALAXY</div>
</header>

<div id="hud">
 <span>SCORE: <span id="score">0</span></span>
 <span>LEBEN: <span id="lives">3</span></span>
 <span>LEVEL: <span id="level">1</span></span>
</div>

<canvas id="game" width="600" height="700"></canvas>

<div id="message">Bereit für den Kampf?</div>

<div class="controls">
 <button id="startBtn">▶ START</button>
 <button id="pauseBtn">Ⅱ PAUSE</button>
 <button id="soundBtn">🔊 TON AN</button>
</div>

<div class="controls" id="mobileControls">
 <button id="leftBtn">◀</button>
 <button id="fireBtn">🔥</button>
 <button id="rightBtn">▶</button>
</div>

<div class="small">
 PC: Pfeiltasten oder A/D zum Bewegen, Leertaste zum Schießen.<br>
 Smartphone: Die unteren Tasten gedrückt halten.
</div>

<script>

// ANDROID / TOUCH SCHUTZ
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());

document.addEventListener("dragstart",e=>e.preventDefault());

let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
 const now=Date.now();
 if(now-lastTouchEnd<=300)e.preventDefault();
 lastTouchEnd=now;
},{passive:false});

// GAME ELEMENTS
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const levelEl=document.getElementById("level");
const message=document.getElementById("message");
const soundBtn=document.getElementById("soundBtn");

let player={x:300,y:625,w:42,h:48,speed:6};
let bullets=[];
let enemies=[];
let stars=[];

let score=0;
let lives=3;
let level=1;
let running=false;
let paused=false;
let gameOver=false;
let frame=0;
let keys={};
let touch={left:false,right:false,fire:false};
let soundEnabled=true;
let audioCtx=null;
let musicTimer=null;
let lastShot=0;

// STARS
for(let i=0;i<100;i++){
 stars.push({
  x:Math.random()*600,
  y:Math.random()*700,
  speed:0.5+Math.random()*2,
  size:Math.random()*2+0.5
 });
}

// AUDIO
function initAudio(){
 if(!audioCtx){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
}

function tone(freq,duration,type="sine",volume=0.08,delay=0){
 if(!soundEnabled||!audioCtx)return;

 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();
 const start=audioCtx.currentTime+delay;

 osc.type=type;
 osc.frequency.setValueAtTime(freq,start);
 gain.gain.setValueAtTime(volume,start);
 gain.gain.exponentialRampToValueAtTime(0.001,start+duration);

 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.start(start);
 osc.stop(start+duration);
}

function shootSound(){
 tone(650,0.12,"sawtooth",0.045);
 tone(350,0.10,"sine",0.035,0.04);
}

function explosionSound(){
 tone(110,0.35,"sawtooth",0.10);
 tone(65,0.45,"triangle",0.08,0.06);
 tone(220,0.12,"square",0.035,0.02);
}

function startSound(){
 tone(260,0.15,"sine",0.07);
 tone(390,0.2,"sine",0.07,0.15);
 tone(520,0.3,"sine",0.07,0.3);
}

function gameOverSound(){
 tone(350,0.3,"triangle",0.08);
 tone(260,0.4,"triangle",0.08,0.3);
 tone(160,0.7,"sawtooth",0.07,0.65);
}

// MUSIC
function startMusic(){
 if(!soundEnabled||!audioCtx||musicTimer)return;

 const notes=[110,164.81,146.83,196,130.81,164.81,110,146.83];
 let n=0;

 musicTimer=setInterval(()=>{
  if(!running||paused||!soundEnabled)return;

  tone(notes[n%notes.length],0.75,"sine",0.018);
  tone(notes[n%notes.length]*2,0.55,"triangle",0.008,0.12);
  n++;
 },650);
}

function stopMusic(){
 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

// RESET
function resetGame(){
 player.x=300;
 bullets=[];
 enemies=[];
 score=0;
 lives=3;
 level=1;
 frame=0;
 gameOver=false;
 paused=false;
 running=true;
 updateHud();
 message.textContent="Die Galaxis braucht dich!";
}

function updateHud(){
 scoreEl.textContent=score;
 livesEl.textContent=lives;
 levelEl.textContent=level;
}

// SHOOT
function shoot(){
 if(!running||paused||gameOver)return;

 const now=Date.now();
 if(now-lastShot<180)return;

 lastShot=now;
 bullets.push({x:player.x,y:player.y-25,speed:9});
 shootSound();
}

// ENEMIES
function spawnEnemy(){
 const size=28+Math.random()*12;

 enemies.push({
  x:30+Math.random()*540,
  y:-40,
  size:size,
  speed:1.4+level*0.35+Math.random()*1.2,
  hp:1
 });
}

// STARS
function drawStars(){
 ctx.fillStyle="white";

 stars.forEach(s=>{
  ctx.globalAlpha=0.4+Math.random()*0.6;
  ctx.fillRect(s.x,s.y,s.size,s.size);
 });

 ctx.globalAlpha=1;
}

// PLAYER
function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 ctx.fillStyle="#36dcff";
 ctx.shadowColor="#00dfff";
 ctx.shadowBlur=18;

 ctx.beginPath();
 ctx.moveTo(0,-27);
 ctx.lineTo(23,23);
 ctx.lineTo(0,13);
 ctx.lineTo(-23,23);
 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;
 ctx.fillStyle="#ffffff";

 ctx.beginPath();
 ctx.moveTo(0,-14);
 ctx.lineTo(6,8);
 ctx.lineTo(-6,8);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#ff9d35";
 ctx.beginPath();
 ctx.moveTo(-7,19);
 ctx.lineTo(0,34+Math.random()*8);
 ctx.lineTo(7,19);
 ctx.fill();

 ctx.restore();
}

// ENEMY DRAWING
function drawEnemies(){
 enemies.forEach(e=>{
  ctx.save();
  ctx.translate(e.x,e.y);

  ctx.fillStyle="#ff315e";
  ctx.shadowColor="#ff174d";
  ctx.shadowBlur=15;

  ctx.beginPath();
  ctx.moveTo(0,e.size);
  ctx.lineTo(-e.size,e.size/2);
  ctx.lineTo(-e.size/2,-e.size/2);
  ctx.lineTo(e.size/2,-e.size/2);
  ctx.lineTo(e.size,e.size/2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
 });
}

// BULLETS
function drawBullets(){
 ctx.fillStyle="#66faff";
 ctx.shadowColor="#00dfff";
 ctx.shadowBlur=12;

 bullets.forEach(b=>{
  ctx.fillRect(b.x-3,b.y-12,6,18);
 });

 ctx.shadowBlur=0;
}

// UPDATE
function update(){
 if(!running||paused||gameOver)return;

 frame++;

 if(keys.ArrowLeft||keys.a||keys.A||touch.left)
  player.x-=player.speed;

 if(keys.ArrowRight||keys.d||keys.D||touch.right)
  player.x+=player.speed;

 player.x=Math.max(25,Math.min(575,player.x));

 if(keys[" "]||touch.fire){
  if(frame%5===0)shoot();
 }

 stars.forEach(s=>{
  s.y+=s.speed;
  if(s.y>700){
   s.y=0;
   s.x=Math.random()*600;
  }
 });

 bullets.forEach(b=>b.y-=b.speed);
 bullets=bullets.filter(b=>b.y>-20);

 if(frame%Math.max(20,65-level*5)===0)
  spawnEnemy();

 enemies.forEach(e=>{
  e.y+=e.speed;

  if(e.y>690){
   e.dead=true;
   lives--;
   updateHud();

   if(lives<=0)endGame();
  }
 });

 bullets.forEach(b=>{
  enemies.forEach(e=>{
   if(!e.dead&&Math.abs(b.x-e.x)<e.size&&
      Math.abs(b.y-e.y)<e.size){
    e.dead=true;
    b.dead=true;
    score+=10;
    explosionSound();
    updateHud();
   }
  });
 });

 bullets=bullets.filter(b=>!b.dead);
 enemies=enemies.filter(e=>!e.dead);

 const newLevel=Math.floor(score/100)+1;

 if(newLevel>level){
  level=newLevel;
  message.textContent="LEVEL "+level+" – Angriff wird stärker!";
  updateHud();
 }
}

// DRAW
function draw(){
 ctx.clearRect(0,0,600,700);

 drawStars();
 drawPlayer();
 drawEnemies();
 drawBullets();

 if(!running&&!gameOver){
  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="bold 28px Arial";
  ctx.fillText("GALACTICA STRIKE",300,300);

  ctx.font="17px Arial";
  ctx.fillText("Drücke START zum Spielen",300,340);
 }

 if(paused){
  ctx.fillStyle="rgba(0,0,0,0.65)";
  ctx.fillRect(0,0,600,700);

  ctx.fillStyle="#70edff";
  ctx.textAlign="center";
  ctx.font="bold 42px Arial";
  ctx.fillText("PAUSE",300,350);
 }

 if(gameOver){
  ctx.fillStyle="rgba(0,0,0,0.72)";
  ctx.fillRect(0,0,600,700);

  ctx.fillStyle="#ff5475";
  ctx.textAlign="center";
  ctx.font="bold 42px Arial";
  ctx.fillText("GAME OVER",300,320);

  ctx.fillStyle="white";
  ctx.font="22px Arial";
  ctx.fillText("Punkte: "+score,300,365);

  ctx.font="17px Arial";
  ctx.fillText("Drücke START für einen neuen Versuch",300,410);
 }
}

// GAME OVER
function endGame(){
 if(gameOver)return;

 gameOver=true;
 running=false;
 touch.left=false;
 touch.right=false;
 touch.fire=false;

 stopMusic();
 gameOverSound();

 message.textContent="Dein Einsatz ist vorbei. Versuche es erneut!";
}

// LOOP
function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

// BUTTONS
document.getElementById("startBtn").addEventListener("click",()=>{
 initAudio();
 resetGame();
 startSound();
 startMusic();
});

document.getElementById("pauseBtn").addEventListener("click",()=>{
 if(!running)return;

 paused=!paused;

 touch.left=false;
 touch.right=false;
 touch.fire=false;

 if(paused){
  stopMusic();
  message.textContent="Spiel pausiert";
 }else{
  startMusic();
  message.textContent="Weiter geht's!";
 }
});

soundBtn.addEventListener("click",()=>{
 soundEnabled=!soundEnabled;
 soundBtn.textContent=soundEnabled?"🔊 TON AN":"🔇 TON AUS";

 if(soundEnabled){
  initAudio();
  startMusic();
  tone(500,0.15,"sine",0.06);
 }else{
  stopMusic();
 }
});

// KEYBOARD
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))
  e.preventDefault();

 keys[e.key]=true;

 if(e.key===" "&&!e.repeat)
  shoot();
});

window.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

window.addEventListener("blur",()=>{
 keys={};
 touch.left=false;
 touch.right=false;
 touch.fire=false;
});

// MOBILE CONTROLS
function holdButton(id,property){
 const btn=document.getElementById(id);

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);
  touch[property]=true;
 });

 function release(e){
  touch[property]=false;
 }

 ["pointerup","pointerleave","pointercancel","lostpointercapture"].forEach(ev=>{
  btn.addEventListener(ev,release);
 });
}

holdButton("leftBtn","left");
holdButton("rightBtn","right");
holdButton("fireBtn","fire");

// BACKGROUND
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  stopMusic();
  touch.left=false;
  touch.right=false;
  touch.fire=false;
 }else if(running&&!paused&&soundEnabled){
  startMusic();
 }
});

// START
draw();
loop();

</script>
</body>
</html>
